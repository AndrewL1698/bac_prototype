# montage default configuration. Every weight and threshold lives here.
# Override with MONTAGE_CONFIG=<extra.yaml> or CLI --set a.b=value.

seed: 0

ingest:
  min_assets: 10
  max_assets: 100
  max_total_video_s: 1200
  max_per_video_s: 120
  analysis_fps: 2
  analysis_short_side: 448
  motion_pair_short_side: 320
  motion_pair_dt_s: 0.0667        # 1/15 s
  workers: 8

candidates:
  window_s: 3.0
  hop_s: 1.5
  min_window_s: 1.0
  edge_trim_s: 0.3
  min_scene_s: 1.0
  scene_detector: adaptive        # adaptive | content
  thumb_width: 256

features:
  version: "f1"                   # bump to invalidate the feature cache
  clip_model: "ViT-L-14"
  clip_pretrained: "openai"
  clip_batch: 128
  aesthetic_weights: "sac+logos+ava1-l14-linearMSE.pth"   # in DATA_ROOT/weights
  yunet_model: "face_detection_yunet_2023mar.onnx"        # in DATA_ROOT/weights
  face_score: 0.7
  tags_file: "configs/tags.txt"
  tags_top_k: 5
  tag_min_cos: 0.2

mood:
  templates: ["a photo of {}", "a video still of {}"]
  prompts:
    arousal_high: ["an energetic, exciting moment", "people dancing at a party", "fast action and movement", "a cheering crowd", "an adrenaline-filled moment"]
    arousal_low: ["a calm, peaceful scene", "a quiet, still moment", "a serene landscape", "a relaxing slow afternoon", "a soft, gentle scene"]
    valence_pos: ["a happy, joyful moment", "friends laughing together", "a bright cheerful day", "a celebration", "a warm, loving moment"]
    valence_neg: ["a sad, melancholic scene", "a gloomy, dark day", "a lonely moment", "a tense, somber scene", "a cold, empty place"]
  arousal_weights: {clip: 0.5, motion: 0.3, color: 0.2}
  valence_weights: {clip: 0.6, brightness: 0.2, color: 0.2}
  photo_motion_z: -0.5

dedup:
  cos_threshold: 0.92

importance:
  heuristic:
    aes: 1.0
    sharp: 0.6
    exp: 0.4
    bright: 0.3
    face_count: 0.5
    face_area: 0.3
    color: 0.3
    motion: 0.4
    shake: 0.5
    junk: 3.0
  junk_tags: ["screenshot", "text document", "receipt", "meme"]
  reject_sharpness_pct: 10
  abs_min_sharpness: 3.0          # log1p(var(Laplacian)); tune on real data, log the choice
  reject_exposure_clip: 0.5
  blend_alpha: 0.5                # overridden by the ranker checkpoint if present
  ranker_weights: "importance_ranker.pt"

music:
  use_beat_this: true            # false = librosa beats only (fallback / tests)
  min_song_s: 40
  max_bpm: 160
  min_bpm: 70
  analysis_sr: 22050
  mert_sr: 24000
  structure:
    kernel_beats: 16
    min_section_beats: 16
    peak_k: 0.5
  emotion:
    use_mert: true
    model: "m-a-p/MERT-v1-95M"
    revision: "12af15fef9d0ac838c3f475bfbbf26d2060dd4f5"   # pinned: the model ships remote code
    window_s: 5.0
    align: "centered"
    batch: 64
    head_weights: "emotion_head.pt"
    use_temporal: false                      # true = phase 14 sequence head (off until the side-by-side check)
    temporal_weights: "emotion_temporal.pt"  # phase 14 sequence head, in DATA_ROOT/weights
    temporal:                                # architecture for new training runs (checkpoints carry their own)
      proj_dim: 128
      hidden: 64
      dropout: 0.2
  intensity:
    w_arousal: 0.5
    w_rms: 0.3
    w_onset: 0.2
    smooth_s: 1.5
  sections:
    slope_thr: 0.05
  excerpt:
    default_length_s: 50
    min_length_s: 45
    max_length_s: 60
    fade_out_s: 1.5
    silence_db: -40
    peak_target_frac: 0.7
    peak_width: 0.15
    weights: {mean: 1.0, peak: 1.0, start: 0.3, end: 0.3, silence: 1.0}

director:
  use_llm: true
  model: "claude-haiku-5-5"
  max_tokens: 2000
  timeout_s: 30
  max_queries: 6
  max_query_words: 8
  send_thumbnails: false
  editor_note: true
  weights: {vibe: 0.6, seg: 1.2, avoid: 1.5, avoid_margin: 0.5, open: 1.5, close: 1.5}
  mood_targets: {calm: 0.15, neutral: 0.5, energetic: 0.85}
  energy_bias_scale: 0.25
  contact_sheet: {cell_px: 128, max_cells: 100}

planner:
  min_shot_s: 0.5
  max_shot_s: 4.0
  max_fill_ratio: 0.9
  boundary_novelty_scale: 0.5
  w_imp: 1.0
  w_mood: 0.8
  w_val: 0.3
  w_dir: 0.6
  photo_min_s: 0.6
  w_photo_short: 0.5
  w_photo_hi: 0.3
  w_must: 5.0
  variety: 0.15
  w_rep: 2.0
  rep_tau: 0.75
  w_src: 1.5
  w_jump: 0.6
  w_contrast: 0.6
  w_chrono: 1.0
  chrono_tol_s: 60
  w_reuse: 2.0
  max_per_cluster: 1
  max_windows_per_video: 3
  min_photo_frac: 0.3
  max_photo_frac: 0.7
  w_ratio: 2.0
  min_pool: 60
  expand_top: 32
  beam_width: 128
  naive_cut_s: 2.0
  inout: {w_aes: 0.4, w_motion: 0.4, w_rel: 0.2, drift_penalty: 0.1, step_s: 0.1}
  # ablation switches (set by eval systems)
  use_forced_cuts: true

render:
  fps: 30
  preset: "veryfast"
  preview: {width: 1280, height: 720, crf: 23}
  export: {width: 1920, height: 1080, crf: 18}
  audio_bitrate: "192k"
  max_crop_loss: 0.25             # 4:3 (25% loss) is cropped to fill; anything wider/taller gets blurred fill
  pano_aspect: 2.5
  blur_sigma: 30
  blur_darken: -0.15
  kb_base: 0.04
  kb_gain: 0.08
  kb_max_pan: 0.03
  fill_blur_oversize: 1.15
  workers: 8
  # per-shot render cache: unchanged shots are reused across renders and recuts.
  # location "scratch" (fast local SSD, per runtime) or "drive" (shared cache/shots/, survives runtimes)
  shot_cache: {enabled: true, location: "scratch", max_gb: 5.0}
  ffmpeg_bin: "ffmpeg"
  ffprobe_bin: "ffprobe"

songpick:                         # phase 12: pick a song from the user's listening history
  min_play_ms: 30000              # shorter plays do not count (Spotify's own stream threshold)
  full_play_ms: 180000            # a play this long counts as 1; shorter plays count pro rata
  skip_penalty: 0.5               # subtracted per skipped play
  period_trim_frac: 0.05          # ignore the earliest/latest 5% of capture dates (stray old photos)
  pad_days: 7                     # period = album dates padded this much on both sides
  min_window_days: 3              # a one-day album still gets a few days of listening
  min_window_events: 20           # fewer plays than this in the period -> widen it
  widen_factor: 2.0               # padding multiplier per widening step
  recency_half_life_days: 365     # whole-history fallback: older plays count less
  lift_prior: 1.0                 # smoothing (in plays) for the period-vs-usual lift
  sig_weight: 0.5                 # affinity = plays_window * lift ** sig_weight ("song of that period")
  min_window_plays: 2             # a candidate needs at least this many real plays in the period
  shortlist_size: 5
  alpha: 1.0                      # score = alpha * affinity + (1 - alpha) * vibe; 1.0 until a vibe stage exists
  w_sources: {export: 1.0, recent: 1.0, top: 1.0}   # per-source affinities (each max-normalized) are summed with these weights
  default_mode: release           # app default: release (songs that came out around the photos) | vibe | export
  # Export mode: listening window centered on the photos' median date, total width by photo age in years
  # (piecewise linear): about a month for photos from a year ago, a season for 5 years, half a year for 10+.
  window_by_age_days: [[0, 21], [1, 30], [5, 90], [10, 180]]
  max_window_days: 365            # widening stops here (total width), then the whole history is used
  release:                        # "songs from back then" with sign-in data: album release date near the photos
    # days BEFORE the photos' median date a song may have come out, by photo age in years (piecewise linear)
    before_days_by_age: [[0, 60], [1, 90], [5, 180], [10, 365]]
    after_frac: 0.25              # days AFTER the median = after_frac * before (songs are mostly heard after release)
    min_candidates: 5             # fewer songs in the window -> widen it by widen_factor
    max_before_days: 1095         # stop widening here, then fall back to "best vibe fit" with a note
    # album/track names with these words carry a re-release date (remaster, compilation), not the song's own
    unreliable_words: ["remaster", "remastered", "deluxe", "anniversary", "greatest hits", "best of", "collection", "edition", "expanded"]
  spotify:                        # "Connect Spotify" (OAuth with PKCE; read-only listening data)
    client_id_env: "SPOTIFY_CLIENT_ID"
    redirect_uri: "https://andrewl1698.github.io/bac_prototype/spotify/callback.html"
    scopes: ["user-read-recently-played", "user-top-read"]
    # Where the callback page may send the browser back. docs/spotify/callback.html (allowed()) hardcodes the
    # same hosts (a static page cannot read this file): change both together (tests check they match).
    return_hosts: [".gradio.live", "127.0.0.1", "localhost"]
    auth_ttl_s: 600               # a sign-in must finish within 10 minutes
    timeout_s: 10
    top_limit: 50
    range_days: {short_term: 28, medium_term: 182, long_term: 365}   # how far back each top-tracks list reaches
    range_weight: {short_term: 1.0, medium_term: 0.7, long_term: 0.5} # narrower ranges say more about "that time"
  youtube:                        # opt-in audio fetch for the picked song (user ticks a box each session)
    enabled: false                # default state of the app checkbox
    max_results: 6                # search results considered
    duration_tol_s: 10            # a result this close to Spotify's track length counts as the same recording
    min_song_s: 60
    max_song_s: 900
    min_match: 0.55               # minimum match score to accept a result
    topic_bonus: 0.25             # "<Artist> - Topic" channels are official audio
    bad_words: ["live", "cover", "remix", "karaoke", "sped up", "slowed", "nightcore", "8d", "instrumental", "reverb"]
    bad_penalty: 0.4
    duration_penalty: 0.4
    cookies_file: ""              # optional cookies.txt path (outside the repo) if YouTube asks to confirm you're not a bot
    cookies_env: "MONTAGE_YT_COOKIES"   # env var with the cookies.txt path (set by colab_bootstrap from the YOUTUBE_COOKIES secret); wins over cookies_file

app:
  port: 7860
  share: true
  default_seed: 0

eval:
  beat_tol_s: 0.07
  pace_window_s: 4.0
  seeds: 3
  systems: ["full", "naive", "beat_random", "greedy", "no_learned", "no_mood", "no_pairwise", "no_director", "no_forced"]
  default_brief: "A fun recap of these moments, matched to the music."
